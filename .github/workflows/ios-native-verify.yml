name: Verify native iOS preview

on:
  push:
    branches: [main]
    paths: ["ios-native/**", ".github/workflows/ios-native-verify.yml"]
  pull_request:
    paths: ["ios-native/**", ".github/workflows/ios-native-verify.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/native-ios-devices.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP'])/'native-ios-devices.json').read_text())['devices']
          candidates = [d for runtime, items in devices.items() if '.iOS-' in runtime for d in items if d['name'].startswith('iPhone') and d.get('isAvailable', False)]
          if not candidates:
              raise SystemExit('An available iPhone simulator is required.')
          device = next((d for d in candidates if 'Pro Max' in d['name']), candidates[0])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid='+device['udid']+'\n')
          print(device['name'])
          PY
      - name: Run mocked protocol tests and native UI flows
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.udid }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native-ios
          xcodebuild test -project ios-native/YapperNative.xcodeproj -scheme YapperNative \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 \
            -derivedDataPath "$RUNNER_TEMP/native-ios-tests" \
            -resultBundlePath dist/native-ios/tests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Build both unsigned Release targets and inspect artifacts
        env:
          DERIVED_DATA: ${{ runner.temp }}/native-ios-release
          OUTPUT_DIR: ${{ github.workspace }}/dist/native-ios
          ARCHIVE_PATH: ${{ runner.temp }}/YapperNative.xcarchive
        shell: bash
        run: |
          set -euo pipefail
          ios-native/scripts/build-native.sh simulator
          ios-native/scripts/build-native.sh archive
          python3 ios-native/scripts/verify-native.py \
            --app "$DERIVED_DATA/Build/Products/Release-iphonesimulator/YapperNative.app" \
            --simulator-zip "$OUTPUT_DIR/Yapinplugger-Native-0.1.0-iOS-Simulator.zip" \
            --ipa "$OUTPUT_DIR/Yapinplugger-Native-0.1.0-ios-unsigned.ipa" \
            --report "$OUTPUT_DIR/package-verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-ios-${{ github.sha }}
          path: dist/native-ios/
          if-no-files-found: warn
          retention-days: 14
