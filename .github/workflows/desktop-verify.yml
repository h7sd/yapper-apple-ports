name: Verify Linux and Windows clients

on:
  push:
    branches: [main]
    paths: ["desktop/**", "macos/**", "extensions/**", "appearance/**", "scripts/verify-macos.mjs", ".github/workflows/desktop-verify.yml"]
  pull_request:
    paths: ["desktop/**", "macos/**", "extensions/**", "appearance/**", "scripts/verify-macos.mjs", ".github/workflows/desktop-verify.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Cross-package and inspect x64 clients
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install packaging utilities
        run: brew install makensis squashfs
      - name: Install locked dependencies
        run: |
          npm ci --prefix desktop --ignore-scripts --no-audit --no-fund
          npm ci --prefix macos --ignore-scripts --no-audit --no-fund
      - name: Check shared source and regression behavior
        run: |
          node scripts/verify-macos.mjs
          npm test --prefix macos
          node extensions/yappercord/build.mjs --check
          node appearance/build.mjs --check
      - name: Build Linux AppImage and tarball, Windows installer and ZIP
        run: npm --prefix desktop run build:all
      - name: Inspect packaged runtimes and bundled extension integrity
        run: npm --prefix desktop run verify
      - name: Record complete dependency advisory inventory
        continue-on-error: true
        run: npm audit --prefix desktop --json > desktop/reports/npm-audit-all.json
      - name: Upload packages and bounded verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yapinplugger-linux-windows-${{ github.sha }}
          path: |
            dist/Yapinplugger-*.AppImage
            dist/Yapinplugger-*.tar.gz
            dist/Yapinplugger-*.zip
            dist/Yapinplugger-*.exe
            desktop/reports/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

