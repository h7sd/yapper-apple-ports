name: Verify macOS port

on:
  push:
    branches: [main]
    paths: ["macos/**", "extensions/**", "appearance/**", "scripts/verify-macos.mjs", ".github/workflows/macos-verify.yml"]
  pull_request:
    paths: ["macos/**", "extensions/**", "appearance/**", "scripts/verify-macos.mjs", ".github/workflows/macos-verify.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      # Official GitHub release refs resolved to commits on 2026-10-30.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - name: Install locked dependencies
        working-directory: macos
        run: npm ci --no-audit --no-fund
      - name: Verify shared extension bundle and inventory
        run: |
          node extensions/yappercord/build.mjs --check
          node --test extensions/yappercord/tests/*.cjs extensions/yappercord/tests/*.mjs
          node appearance/build.mjs --check
          node --test appearance/tests/appearance.test.cjs
      - name: Check syntax, source guards, and provenance
        run: node scripts/verify-macos.mjs
      - name: Run regression tests
        working-directory: macos
        run: npm test
      - name: Build locally signed app
        working-directory: macos
        run: npm run build:mac -- --arch=${{ matrix.arch }}
      - name: Verify archive content, signatures, and architecture
        run: node scripts/verify-macos.mjs --arch=${{ matrix.arch }}
      - name: Record dependency advisory report
        # Advisory inventory is nonblocking and is not malware scanning.
        id: audit
        continue-on-error: true
        working-directory: macos
        run: npm audit --json > ../dist/npm-audit-${{ matrix.arch }}.json
      - name: Upload app ZIP, checksums, and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yapper-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/Yapper-*-mac-${{ matrix.arch }}.zip
            dist/SHA256SUMS-${{ matrix.arch }}.txt
            dist/macos-verification-*.json
            dist/npm-audit-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Surface advisory-report status
        if: always() && steps.audit.outcome == 'failure'
        run: echo '::warning::npm audit reported advisories or could not complete. Inspect npm-audit JSON in the artifact. A passing build is not a malware or vulnerability clearance.'
